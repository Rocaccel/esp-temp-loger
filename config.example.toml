# Образец конфигурации. Скопируй в config.toml и впиши свои значения.
# Генерация файла для платы: uv run python tools/gen_secrets.py

[wifi]
ssid = "MyWiFi"
password = "secret"

[firebase]
api_key = "AIza..."
database_url = "https://<project>-default-rtdb.firebaseio.com"
device_id = "esp32-1"

[power]
sleep_sec = 60

[watchdog]
# Сторож на цикл. В deep sleep сторож стоит, таймаут должен
# превышать сон + цикл, иначе ребуты вместо сна.
enabled = true
timeout_ms = 90000

[network]
# Пустые строки = DHCP. Заполни все 4 для статического IP
# (убирает DHCP с каждого пробуждения).
static_ip = ""
static_mask = ""
static_gw = ""
static_dns = ""

[device]
mdns_hostname = "temp-logger"

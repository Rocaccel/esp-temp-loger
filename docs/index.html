<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Climate</title>
    <style>
        body{font-family:Arial;margin:20px;background:#f5f5f5}
        .card{background:#fff;padding:15px;margin:15px 0;border-radius:8px;
            box-shadow:0 2px 5px rgba(0,0,0,.1)}
        .big{font-size:2.5em;font-weight:bold}
        .muted{color:#888;font-size:.9em}
        canvas{width:100%;height:200px;background:#fafafa;
            border:1px solid #ddd}
        button{padding:6px 14px;font-size:1em}
        input{padding:5px;font-size:1em;width:70px}
    </style>
</head>
<body>
    <h1>Климат-монитор</h1>
    <div class="card">
        <span>Температура:</span> <span id="t" class="big">--</span> °C<br>
        <span>Влажность:</span> <span id="h" class="big">--</span> %<br>
        <span class="muted">Обновлено: <span id="updated">--</span></span>
    </div>
    <div class="card"><h3>Температура — по часам (сутки)</h3>
    <canvas id="c1"></canvas></div>
    <div class="card"><h3>Влажность — по часам (сутки)</h3>
    <canvas id="c2"></canvas></div>
    <div class="card"><h3>Часовой пояс (хранится в этом браузере)</h3>
        <label>Поправка, часов:
        <input type="number" id="tz" min="-12" max="14"
            step="1" required></label>
        <button id="tzSave" type="button">Сохранить</button>
        <span id="tzMsg" class="muted"></span>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
